name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  frontend-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: teleprompter/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: teleprompter/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm test

  frontend-e2e:
    name: Frontend E2E Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: teleprompter/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: teleprompter/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            teleprompter/frontend/playwright-report/
            teleprompter/frontend/test-results/
          retention-days: 7

  cpp-tests:
    name: C++ Unit Tests
    runs-on: windows-latest
    defaults:
      run:
        working-directory: teleprompter
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup WebView2 SDK
        run: .\scripts\setup-webview2.ps1
        shell: pwsh

      - name: Configure CMake
        run: cmake -B build -DBUILD_TESTS=ON

      - name: Build C++ tests
        run: cmake --build build --target string_utils_test matcher_test audio_test

      - name: Run C++ tests
        run: ctest --test-dir build --output-on-failure
